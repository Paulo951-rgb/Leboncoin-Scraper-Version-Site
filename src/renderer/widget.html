<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Widget — Leboncoin Scraper Pro</title>
  <style>
    :root {
      --neutral-50: #f8fafc;
      --neutral-100: #f1f5f9;
      --neutral-400: #94a3b8;
      --neutral-500: #64748b;
      --neutral-700: #334155;
      --neutral-800: #1e293b;
      --neutral-900: #0f172a;
      --neutral-950: #020617;
      --primary-400: #60a5fa;
      --primary-500: #3b82f6;
      --primary-600: #2563eb;
      --success-400: #4ade80;
      --success-500: #22c55e;
      --error-400: #f87171;
      --error-500: #ef4444;
      --warning-500: #f59e0b;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-full: 999px;
      --shadow-sm: 0 1px 2px 0 rgba(0,0,0,0.05), 0 1px 3px 0 rgba(0,0,0,0.08);
      --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.08), 0 2px 4px -1px rgba(0,0,0,0.06);
      --shadow-lg: 0 10px 25px -5px rgba(0,0,0,0.15), 0 8px 10px -6px rgba(0,0,0,0.08);
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      --transition-fast: 150ms ease;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--neutral-950);
      color: var(--neutral-50);
      font-family: var(--font-sans);
      overflow: hidden;
      user-select: none;
      -webkit-app-region: drag;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .widget-container {
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: linear-gradient(180deg, var(--neutral-900) 0%, var(--neutral-950) 100%);
      min-height: 100vh;
    }

    .widget-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .widget-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-400);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      letter-spacing: 0.01em;
    }

    .widget-status-dot {
      width: 8px;
      height: 8px;
      border-radius: var(--radius-full);
      flex-shrink: 0;
      box-shadow: 0 0 0 2px rgba(255,255,255,0.05);
    }

    .status-idle { background: var(--neutral-500); }
    .status-running { background: var(--success-500); animation: pulse 1.2s infinite; }
    .status-error { background: var(--error-500); }
    .status-completed { background: var(--primary-400); }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    .widget-percent {
      font-size: 22px;
      font-weight: 700;
      text-align: center;
      color: var(--neutral-50);
      letter-spacing: -0.02em;
      padding: 4px 0;
    }

    .widget-progress-bar {
      height: 6px;
      background: var(--neutral-800);
      border-radius: var(--radius-full);
      overflow: hidden;
      border: 1px solid var(--neutral-800);
    }

    .widget-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary-500), var(--success-400));
      border-radius: var(--radius-full);
      transition: width 0.4s ease;
      width: 0%;
    }

    .widget-message {
      font-size: 12px;
      color: var(--neutral-400);
      line-height: 1.4;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-height: 17px;
    }

    .widget-footer {
      display: flex;
      justify-content: center;
      -webkit-app-region: no-drag;
      margin-top: 4px;
    }

    .widget-close-btn {
      background: transparent;
      border: 1px solid var(--neutral-700);
      color: var(--neutral-400);
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 500;
      padding: 4px 16px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: all var(--transition-fast);
    }

    .widget-close-btn:hover {
      border-color: var(--error-500);
      color: var(--error-400);
      background: rgba(239, 68, 68, 0.08);
    }

    .widget-close-btn:active {
      transform: scale(0.96);
    }
  </style>
</head>
<body>
  <div class="widget-container">
    <div class="widget-header">
      <span class="widget-title">🛒 Scraper Pro</span>
      <span class="widget-status-dot status-idle" id="statusDot"></span>
    </div>
    <div class="widget-percent" id="percentText">—</div>
    <div class="widget-progress-bar">
      <div class="widget-progress-fill" id="progressFill"></div>
    </div>
    <div class="widget-message" id="messageText">En attente…</div>
    <div class="widget-footer">
      <button class="widget-close-btn" id="closeBtn">Fermer</button>
    </div>
  </div>
  <script>
    const statusDot = document.getElementById('statusDot');
    const percentText = document.getElementById('percentText');
    const progressFill = document.getElementById('progressFill');
    const messageText = document.getElementById('messageText');

    window.widgetApi.onProgress((data) => {
      if (data.percent != null) {
        percentText.textContent = data.percent + '%';
        progressFill.style.width = Math.min(100, Math.max(0, data.percent)) + '%';
      }
      if (data.status) {
        messageText.textContent = data.status;
      }
    });

    window.widgetApi.onStatus((data) => {
      const st = data.state || 'idle';
      // Le widget mappe les états « partiel » / « refusé » / « limité » sur des
      // classes visuelles connues (pas de CSS dédiée) pour garder un retour clair.
      const dotClass = (st === 'completed' || st === 'partial') ? 'status-completed'
        : (st === 'refused' || st === 'rate_limited' || st === 'error') ? 'status-error'
        : 'status-' + st;
      statusDot.className = 'widget-status-dot ' + dotClass;
      if (data.message) {
        messageText.textContent = data.message;
      }
      if (st === 'completed' || st === 'partial') {
        percentText.textContent = st === 'partial' ? '~' : '✓';
        progressFill.style.width = '100%';
      } else if (st === 'error' || st === 'refused' || st === 'rate_limited') {
        percentText.textContent = '!';
        progressFill.style.width = '0%';
      }
    });

    document.getElementById('closeBtn').addEventListener('click', () => {
      window.widgetApi.close();
    });
  </script>
</body>
</html>
